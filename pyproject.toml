[project]
name = "district-heating-multihop-sim"
version = "0.1.0"
description = "Discrete-event simulation of LoRa multihop scheme for district heating grids"
readme = "README.md"
authors = [
    { name = "Christian Kjærsgaard Nielsen", email = "christankjaernielsen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "seaborn>=0.13.2",
    "simpy>=4.1.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "ruff>=0.16.4",
]
