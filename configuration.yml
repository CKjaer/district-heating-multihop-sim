network:
  burial_depth: -1.0      # m
  num_nodes: 2
  spacing: 12.0           # m

radio:
  frequency: 868.0e+6     # Hz
  tx_power: -4.0          # dBm
  tx_gain: 0.0            # dBi
  rx_gain: 0.0            # dBi
  rx_sensitivity: -111    # dBm, for SX1276 SF6/500 kHz
  bandwidth: 500.0e+3     # Hz
  spreading_factor: 6     
  sym_limit: 65535

# Config for underground-to-underground link between nodes
u2u:
  ref_dist: 1.0           # m
  rel_permeability: 1.0

  # FR-3718 insulation from General Plastics @1 GHz
  loss_tan: 0.00218
  rel_permittivity: 1.21

# Config for underground node to aboveground gateway link
u2g:
  std_shadowing: 6.0      # dB
  cell_coverage_prob: 0.90          
  coverage_case: "radial" #  "edge" | "radial"
  path_loss_exponent: 2.0

energy:
  vcc: 3.3                    # V
  harvest_power: 0.55e-3      # W
  sleep_current: 0.2e-6       # A
  tx_current: 20.0e-3         # A
  rx_current: 13.8e-3         # A
  cad_process_current: 8.3e-3 # A
  buffer: 7.92                # J, 1F supercapacitor 

mac:
  cad_interval: 10.0      # s
  max_start_delay: 5.0    # s
  measure_interval: 30.0  # s 
  anycast: False          # True: Anycast, False: BMAC with cad_interval=preamble_len
  excess_path_loss: 0.0   # dB/m