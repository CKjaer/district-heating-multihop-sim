network:
  burial_depth: -1.0      # m
  num_nodes: 10
  spacing: 12.0           # m

radio:
  frequency: 868.0e+6     # Hz
  tx_power: -4.0          # dBm
  tx_gain: 0.0            # dBi
  rx_gain: 0.0            # dBi
  rx_sensitivity: -111    # dBm, For SX1276/77/78/79 devices @500 kHz bandwidth in HF mode
  bandwidth: 500.0e+3     # Hz
  spreading_factor: 6

# Config for underground-to-underground link between nodes
u2u:
  ref_dist: 1.0           # m
  rel_permeability: 1.0

  # FR-3718 insulation from General Plastics @1 GHz
  loss_tan: 0.00218
  rel_permittivity: 1.21

# Config for underground node to aboveground gateway link
u2g:
  std_shadowing: 6.0      # dB
  cell_coverage_prob: 0.90          
  coverage_case: "radial" #  "edge" | "radial"
  path_loss_exponent: 2.0

energy:
  vcc: 3.3                # V
  tcvr:
    name: "SX1276" # For SF6 and BW=500 kHz
    sleep_current: 1.0e-6 # A
    tx_current: 20.0e-3   # A
    rx_current: 13.8e-3   # A
    cad_process_current: 13.0e-3 # A

mac:
  packet_rate: 1.0
  cad_interval: 2.0       # s
  n_preamble_sym: 8       # LoRa symbols (without syncword)